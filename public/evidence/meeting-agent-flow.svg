<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">회의 에이전트 연동 구조 설명도</title><desc id="desc">회의 기록에서 할 일 정리와 사용자 확인을 거쳐 Jira, Slack, Google Calendar로 연결하는 프로젝트 구조를 설명한 도식. 실제 앱 화면이 아닙니다.</desc>
<rect width="1200" height="760" fill="#172033"/>
<g font-family="system-ui, sans-serif"><text x="66" y="90" fill="#91a9ca" font-size="17" letter-spacing="3">MEETING → ACTION</text><text x="66" y="153" fill="#fff" font-size="40" font-weight="650">회의가 다음 업무로 이어지도록.</text><text x="66" y="194" fill="#a3afc1" font-size="18">프로젝트 구조 설명도 · 실제 UI 화면 아님</text>
