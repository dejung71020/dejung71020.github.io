<g fill="#fff" font-size="25" font-weight="600" text-anchor="middle"><text x="174" y="346">회의 기록</text><text x="444" y="346">할 일 정리</text><text x="724" y="346">사용자 확인</text><text x="1009" y="346">업무 도구 연결</text></g>
